services:
  - type: web
    name: ai-lead-generation-scoring
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: app-data
      mountPath: /app/backend/data
      sizeGB: 1
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_PATH
        value: data/app.db
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: SALESFORCE_USERNAME
        sync: false
      - key: SALESFORCE_PASSWORD
        sync: false
      - key: SALESFORCE_SECURITY_TOKEN
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_CHANNEL_ID
        sync: false
      - key: LICENSE_PRIVATE_KEY
        sync: false
      - key: LICENSE_PUBLIC_KEY
        sync: false
      # Public hosted app behind crmscoring.com's "Get started free": each
      # visitor gets a private trial workspace; the default workspace (and
      # this deployment's own LICENSE_KEY) is never exposed to them.
      - key: HOSTED_MODE
        value: "true"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: live
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: BILLING_CURRENCY
        value: USD
      - key: STOREFRONT_URL
        value: https://crmscoring.com
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
