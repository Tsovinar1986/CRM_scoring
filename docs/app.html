<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Opening your workspace — CRM Scoring</title>
<style>
  :root { --text: #6b6152; --bg: #f6f1e6; --accent: #b3401f; }
  @media (prefers-color-scheme: dark) { :root { --text: #b6a993; --bg: #18130c; --accent: #e37a4c; } }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 0 16px;
  }
  a { color: var(--accent); }
</style>
</head>
<body>
  <p>Opening your workspace… <a id="go" href="https://ai-lead-generation-scoring.onrender.com/">Continue</a></p>
  <script>
    // This page used to be a separate, cut-down copy of the app. Everything
    // (account settings, billing, charts) now lives in the hosted app, so
    // send visitors there -- carrying over a workspace this site already
    // signed them into, which the app adopts from #workspace=... .
    (function () {
      var APP_URL = "https://ai-lead-generation-scoring.onrender.com/";
      var key = null;
      try {
        key = localStorage.getItem("crmscoring_workspace_key");
        localStorage.removeItem("crmscoring_workspace_key");
        localStorage.removeItem("crmscoring_new_user");
        localStorage.removeItem("crmscoring_chart_type");
      } catch (e) {}
      var target = key ? APP_URL + "#workspace=" + encodeURIComponent(key) : APP_URL;
      document.getElementById("go").href = target;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
